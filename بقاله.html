<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بقالة سالي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>بقالة سالي</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%D8%A8%D9%82%D8%A7%D9%84%D8%A9%20%D8%B3%D8%A7%D9%84%D9%8A%22%2C%22short_name%22%3A%22%D8%B3%D8%A7%D9%84%D9%8A%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0a14%22%2C%22theme_color%22%3A%22%237c3aed%22%2C%22orientation%22%3A%22portrait%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2527%2520viewBox%253D%25270%25200%252024%252024%2527%253E%253Crect%2520width%253D%252724%2527%2520height%253D%252724%2527%2520rx%253D%25276%2527%2520fill%253D%2527%25237c3aed%2527%252F%253E%253Cpath%2520d%253D%2527M3%25209l1.5-5h15L21%25209M3%25209v10a1%25201%25200%2520001%25201h16a1%25201%25200%2520001-1V9M3%25209h18%2527%2520stroke%253D%2527white%2527%2520stroke-width%253D%25272%2527%2520fill%253D%2527none%2527%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --v1:#7c3aed;--v2:#6d28d9;--v3:#a78bfa;
  --pink:#ec4899;--cyan:#06b6d4;
  --red:#e11d48;--red-bg:#ffe4e9;
  --green:#059669;--green-bg:#d1fae5;
  --warn:#d97706;--warn-bg:#fef3c7;
  --info:#0284c7;--info-bg:#e0f2fe;
  --bg:#f7f7fb;--bg2:#eef0f6;--bg3:#e3e6ef;
  --card:#fff;--card2:#fafbff;
  --bd:#e9ecf4;--bd2:#dde1ec;
  --tx:#0b0a15;--tx2:#3d3a55;--tx3:#6e6987;--mut:#98a0b6;
  --ov:rgba(11,10,21,.5);
  --sh:0 1px 3px rgba(11,10,21,.06),0 1px 2px rgba(11,10,21,.04);
  --sh2:0 4px 12px -2px rgba(11,10,21,.08);
  --r1:8px;--r2:12px;--r3:16px;--r4:20px;--r5:26px;--rf:999px;
  --e:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#0a0a14;--bg2:#10102a;--bg3:#181836;
  --card:#14142a;--card2:#1a1a30;
  --bd:#222244;--bd2:#2e2e52;
  --tx:#f8f7fc;--tx2:#c8c6dc;--tx3:#9694b0;--mut:#615f7e;
  --ov:rgba(0,0,0,.72);
  --red-bg:#4a0d1a;--green-bg:#064e3b;--warn-bg:#451a03;--info-bg:#082f49;
  --sh:0 1px 3px rgba(0,0,0,.4);
  --sh2:0 4px 12px rgba(0,0,0,.5);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Cairo","Tajawal",Tahoma,Arial,sans-serif;
  background:var(--bg);color:var(--tx);direction:rtl;
  font-size:14px;line-height:1.5;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum","kern";
  background-image:radial-gradient(ellipse 70% 40% at 15% 0%,rgba(124,58,237,.10),transparent 55%),radial-gradient(ellipse 60% 45% at 85% 100%,rgba(236,72,153,.08),transparent 55%);
  background-attachment:fixed;
}
[data-theme="dark"] body{
  background-image:radial-gradient(ellipse 70% 40% at 15% 0%,rgba(124,58,237,.22),transparent 55%),radial-gradient(ellipse 60% 45% at 85% 100%,rgba(236,72,153,.18),transparent 55%);
}
button,input,select,textarea{font-family:inherit;font-size:1em;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;position:relative;overflow:hidden}
input,select,textarea{outline:none;width:100%}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
[data-fs="small"]{font-size:13px}
[data-fs="large"]{font-size:15.5px}
[data-fs="xlarge"]{font-size:17px}
.rp{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.18;pointer-events:none;animation:rp .45s var(--e) forwards}
@keyframes rp{to{transform:scale(3);opacity:0}}
.ic{width:1em;height:1em;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic-xs{font-size:11px}.ic-sm{font-size:13px}.ic-lg{font-size:19px}

.lock{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#4c1d95,#6d28d9,#a855f7)}
.lock.hidden{display:none}
.lock-box{position:relative;text-align:center;width:100%;max-width:300px;color:#fff}
.lock-logo{width:72px;height:72px;margin:0 auto 14px;border-radius:22px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
.lock-logo svg{width:34px;height:34px;stroke:#fff;stroke-width:2;fill:none}
.lock-box h2{font-size:22px;font-weight:900;margin-bottom:4px;letter-spacing:-.03em}
.lock-box p{font-size:12.5px;opacity:.85;margin-bottom:22px;font-weight:500}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4);transition:all .18s var(--e)}
.pin-dot.filled{background:#fff;border-color:#fff;transform:scale(1.15)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pin-key{padding:17px 0;border-radius:16px;color:#fff;font-size:21px;font-weight:700;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);transition:transform .1s}
.pin-key:active{transform:scale(.93);background:rgba(255,255,255,.28)}
.pin-key.empty{visibility:hidden;pointer-events:none}
.pin-key.back svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.shake{animation:sh .35s var(--e)}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.header{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--bd)}
.h-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px -2px rgba(124,58,237,.4)}
.logo svg{width:20px;height:20px;stroke:#fff;stroke-width:2.2;fill:none}
.brand-txt{min-width:0;overflow:hidden}
.brand-name{font-weight:800;font-size:14px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:10px;color:var(--mut);margin-top:1px;font-weight:600;display:flex;align-items:center;gap:4px}
.dot-live{width:5px;height:5px;border-radius:50%;background:#10b981}
.h-actions{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:11px;background:var(--bg2);color:var(--tx2);display:flex;align-items:center;justify-content:center;transition:transform .12s var(--e);border:1px solid var(--bd)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.9);background:var(--bg3)}

.main{max-width:760px;margin:0 auto;padding:12px 10px 96px;position:relative}
.screen{display:none}
.screen.active{display:block;animation:si .2s var(--e)}
@keyframes si{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{font-size:11px;font-weight:800;color:var(--tx3);margin:14px 0 8px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.sec:first-child{margin-top:0}
.sec>span:first-child{display:flex;align-items:center;gap:6px}
.sec .cnt{background:#ede9fe;color:#6d28d9;padding:2px 8px;border-radius:var(--rf);font-size:10px;font-weight:900;letter-spacing:0;text-transform:none}
[data-theme="dark"] .sec .cnt{background:#2e1065;color:#c4b5fd}

.hero{position:relative;overflow:hidden;border-radius:var(--r5);padding:18px;margin-bottom:10px;color:#fff;background:linear-gradient(135deg,#4c1d95 0%,#7c3aed 50%,#ec4899 100%);box-shadow:0 12px 32px -10px rgba(124,58,237,.5)}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero-lbl{font-size:11.5px;opacity:.92;font-weight:600;display:flex;align-items:center;gap:5px}
.hero-lbl svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.hero-chip{background:rgba(255,255,255,.22);padding:4px 11px;border-radius:var(--rf);font-size:10.5px;font-weight:800;border:1px solid rgba(255,255,255,.3);white-space:nowrap}
.hero-amt{font-size:38px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:8px 0 4px;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.hero-amt small{font-size:15px;font-weight:600;opacity:.85}
.hero-sub{font-size:11.5px;opacity:.92;display:flex;align-items:center;gap:5px;font-weight:500}
.hero-sub svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.hero-prog{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:12px}
.hero-ring{width:44px;height:44px;position:relative;flex-shrink:0}
.hero-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero-ring .rb{stroke:rgba(255,255,255,.22);stroke-width:4;fill:none}
.hero-ring .rf{stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;transition:stroke-dashoffset .7s var(--e)}
.hero-ring .rpct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:-.03em}
.hero-prog-txt{flex:1;min-width:0}
.hero-prog-txt .t1{font-size:10.5px;opacity:.85;font-weight:600}
.hero-prog-txt .t2{font-size:12.5px;font-weight:800;margin-top:2px;letter-spacing:-.015em}

/* ALERTS — جديد */
.alerts{background:var(--card);border:1px solid var(--bd);border-radius:var(--r4);padding:11px 13px;margin-bottom:8px;box-shadow:var(--sh)}
.alerts-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px}
.alerts-title{font-size:12px;font-weight:900;display:flex;align-items:center;gap:6px;letter-spacing:-.01em}
.alerts-title svg{width:14px;height:14px;stroke:#f59e0b;fill:none;stroke-width:2.2}
.alerts-badge{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;padding:2px 8px;border-radius:var(--rf);font-size:10px;font-weight:900;letter-spacing:-.01em}
.alerts-list{display:flex;flex-direction:column;gap:6px}
.alert-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r2);background:var(--bg2);cursor:pointer;transition:transform .1s var(--e)}
.alert-row:active{transform:scale(.98)}
.alert-row.overdue{background:linear-gradient(135deg,var(--red-bg),rgba(244,63,94,.06));border:1px solid rgba(244,63,94,.18)}
.alert-row.soon{background:linear-gradient(135deg,var(--warn-bg),rgba(245,158,11,.06));border:1px solid rgba(245,158,11,.18)}
.alert-row.paid{background:linear-gradient(135deg,var(--green-bg),rgba(16,185,129,.06));border:1px solid rgba(16,185,129,.18)}
.alert-ico{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
[data-theme="dark"] .alert-ico{background:rgba(255,255,255,.06)}
.alert-ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.overdue .alert-ico{color:var(--red)}
.soon .alert-ico{color:var(--warn)}
.paid .alert-ico{color:var(--green)}
.alert-info{flex:1;min-width:0}
.alert-name{font-size:12px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.alert-desc{font-size:10.5px;color:var(--mut);font-weight:700;margin-top:2px}
.alert-amt{font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.bento{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-bottom:8px}
.bento .stat:first-child{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between}
.stat{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:var(--r3);padding:11px;transition:transform .12s var(--e);box-shadow:var(--sh)}
.stat:active{transform:scale(.97)}
.stat.c-red{color:var(--red)}.stat.c-green{color:var(--green)}.stat.c-orange{color:var(--warn)}.stat.c-violet{color:var(--v1)}.stat.c-cyan{color:var(--info)}
.stat-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stat-ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c-red .stat-ico{background:var(--red-bg);color:#be123c}
.c-green .stat-ico{background:var(--green-bg);color:#047857}
.c-orange .stat-ico{background:var(--warn-bg);color:#b45309}
.c-violet .stat-ico{background:#ede9fe;color:#6d28d9}
.c-cyan .stat-ico{background:var(--info-bg);color:#0369a1}
[data-theme="dark"] .c-red .stat-ico{color:#fda4af}
[data-theme="dark"] .c-green .stat-ico{color:#6ee7b7}
[data-theme="dark"] .c-orange .stat-ico{color:#fbbf24}
[data-theme="dark"] .c-violet .stat-ico{background:#2e1065;color:#c4b5fd}
[data-theme="dark"] .c-cyan .stat-ico{color:#7dd3fc}
.stat-lbl{font-size:9.5px;color:var(--tx3);font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.2}
.stat-val{font-size:15px;font-weight:900;letter-spacing:-.03em;color:var(--tx);line-height:1;display:flex;align-items:baseline;gap:2px;font-variant-numeric:tabular-nums}
.stat-val small{font-size:9px;font-weight:800;color:var(--mut)}
.bento .stat:first-child .stat-val{font-size:23px;margin-top:auto}
.bento .stat:first-child .stat-lbl{font-size:10.5px}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.qbtn{background:var(--card);border:1px solid var(--bd);border-radius:var(--r3);padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s var(--e);box-shadow:var(--sh)}
.qbtn:active{transform:scale(.94)}
.qbtn .em{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.qbtn .em svg{width:18px;height:18px;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qbtn.violet .em{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
.qbtn.green .em{background:linear-gradient(135deg,#34d399,#10b981);color:#fff}
.qbtn.orange .em{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.qbtn.blue .em{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff}
.qbtn .lbl{font-size:10.5px;font-weight:800;color:var(--tx2);letter-spacing:-.005em}

.list{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r3);padding:11px 12px;transition:transform .12s var(--e);cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh)}
.srow::before{content:"";position:absolute;top:0;right:0;width:3px;height:100%;background:var(--red);opacity:0}
.srow.debt::before{opacity:1}
.srow:active{transform:scale(.985)}
.srow-av{width:40px;height:40px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,#ede9fe,#ddd6fe);display:flex;align-items:center;justify-content:center}
[data-theme="dark"] .srow-av{background:linear-gradient(135deg,#2e1065,#4c1d95)}
.srow-av svg{width:19px;height:19px;stroke:#7c3aed;stroke-width:2.2;fill:none}
[data-theme="dark"] .srow-av svg{stroke:#c4b5fd}
.srow-info{flex:1;min-width:0}
.srow-name{font-weight:800;font-size:13px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx);display:flex;align-items:center;gap:6px}
.srow-meta{font-size:10.5px;color:var(--mut);margin-top:2px;display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.srow-meta svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.2;flex-shrink:0}
.srow-amt{text-align:end;flex-shrink:0}
.srow-amt .a{font-weight:900;font-size:14.5px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.srow-amt small{display:block;font-size:9px;color:var(--mut);font-weight:800;margin-top:1px}
.t-red{color:var(--red)}.t-green{color:var(--green)}.t-orange{color:var(--warn)}.t-violet{color:var(--v1)}.t-blue{color:#3b82f6}
.heat{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* Recent activity */
.activity{background:var(--card);border:1px solid var(--bd);border-radius:var(--r3);padding:5px 13px;margin-bottom:8px;box-shadow:var(--sh)}
.act-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.act-row:last-child{border-bottom:none}
.act-ico{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg2);color:var(--tx2)}
.act-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.act-ico.green{background:var(--green-bg);color:#059669}
.act-ico.red{background:var(--red-bg);color:#e11d48}
.act-ico.violet{background:#ede9fe;color:#7c3aed}
[data-theme="dark"] .act-ico.green{color:#6ee7b7}
[data-theme="dark"] .act-ico.red{color:#fda4af}
[data-theme="dark"] .act-ico.violet{background:#2e1065;color:#c4b5fd}
.act-info{flex:1;min-width:0}
.act-title{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-time{font-size:10px;color:var(--mut);font-weight:700;margin-top:1px}
.act-amt{font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums}

.search{position:relative;margin-bottom:10px}
.search input{padding:11px 40px 11px 36px;border-radius:var(--r3);background:var(--card);border:1.5px solid var(--bd);font-size:13px;font-weight:600;transition:all .15s var(--e);color:var(--tx);box-shadow:var(--sh)}
.search input::placeholder{color:var(--mut);font-weight:500}
.search input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.search .si{position:absolute;top:50%;right:13px;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search .si svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.search input:focus~.si{color:var(--v1)}
.search .sc{position:absolute;top:50%;left:10px;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--bg3);color:var(--mut);display:none;align-items:center;justify-content:center}
.search .sc svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.5;fill:none}
.search.val .sc{display:flex}

/* Global search results */
.gsearch-results{background:var(--card);border:1px solid var(--bd);border-radius:var(--r3);overflow:hidden;box-shadow:var(--sh);margin-bottom:10px}
.gsr-section{padding:8px 13px;background:var(--bg2);font-size:10px;font-weight:900;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}

const DB_KEY='sali_grocery_db_v1';

  try{const r=localStorage.getItem(DB_KEY);if(r)return JSON.parse(r);}catch(e){}
  return{suppliers:[],purchases:[],payments:[],log:[],settings:{storeName:'بقالة سالي',ownerName:'',phone:'',currency:'ريال',pin:'',theme:'light',fontSize:'normal'}};
}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){toast('خطأ في الحفظ','error');}}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>db.settings.currency||'ريال';
const daysBet=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const daysUntil=(d)=>daysBet(today(),d);

function toast(msg,type=''){
  const t=document.getElementById('toast');
  const icn=type==='error'?'xC':type==='success'?'checkC':'info';
  t.innerHTML=ic(icn)+'<span>'+esc(msg)+'</span>';
  t.className='toast show '+type;
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1800);
}
function addLog(type,details,amount,supplierId){
  db.log.unshift({id:uid(),type,details,amount:amount||0,supplierId:supplierId||null,date:today(),time:nowTime(),at:Date.now()});
  if(db.log.length>500)db.log.length=500;
}
function confetti(){
  const colors=['#7c3aed','#a855f7','#d946ef','#ec4899','#06b6d4','#10b981','#f59e0b'];
  const w=document.createElement('div');w.className='cf';
  for(let i=0;i<24;i++){
    const p=document.createElement('div');p.className='cfp';
    p.style.left=Math.random()*100+'%';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];

}

  b.appendChild(rp);
  rpTimer=setTimeout(()=>rp.remove(),450);
},{passive:true});

/* CALCULATIONS */
function supplierTotals(sid){
  const p=db.purchases.filter(x=>x.supplierId===sid).reduce((s,x)=>s+x.totalAmount,0);
  const c=db.payments.filter(x=>x.supplierId===sid).reduce((s,x)=>s+x.amount,0);
  return{purchased:p,paid:c,balance:p-c};
}
function globalTotals(){
  const p=db.purchases.reduce((s,x)=>s+x.totalAmount,0);
  const c=db.payments.reduce((s,x)=>s+x.amount,0);
  return{purchased:p,paid:c,balance:p-c};
}
function allocation(sid){
  const ps=db.purchases.filter(p=>p.supplierId===sid).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  const pays=db.payments.filter(p=>p.supplierId===sid);
  const alloc={};ps.forEach(p=>alloc[p.id]=0);
  pays.forEach(pay=>{if(pay.purchaseId&&alloc[pay.purchaseId]!==undefined)alloc[pay.purchaseId]+=pay.amount;});
  let un=pays.filter(p=>!p.purchaseId).reduce((s,p)=>s+p.amount,0);
  for(const p of ps){if(un<=0)break;const need=Math.max(0,p.totalAmount-alloc[p.id]);const g=Math.min(need,un);alloc[p.id]+=g;un-=g;}
  return alloc;
}
function purchasePaid(pid){const p=db.purchases.find(x=>x.id===pid);if(!p)return 0;return allocation(p.supplierId)[pid]||0;}
function purchaseStatus(p){
  const paid=purchasePaid(p.id);const rem=p.totalAmount-paid;
  if(rem<=0.01)return{key:'paid',label:'مسدد',icon:'checkC',paid,remaining:0};
  if(paid>0.01)return{key:'partial',label:'جزئي',icon:'clock',paid,remaining:rem};
  return{key:'unpaid',label:'غير مسدد',icon:'alert',paid:0,remaining:rem};
}
function supplierStatus(sid){
  const{balance,purchased}=supplierTotals(sid);
  if(balance<=0.01)return{key:'paid',label:'مسدد',color:'green'};
  if(balance<purchased)return{key:'partial',label:'جزئي',color:'orange'};
  return{key:'unpaid',label:'مستحق',color:'red'};
}
function supplierLedger(sid){
  const rows=[];
  db.purchases.filter(p=>p.supplierId===sid).forEach(p=>{
    rows.push({date:p.date,desc:`شراء ${p.description||'بضاعة'}${p.invoiceNumber?' — '+p.invoiceNumber:''}`,debit:p.totalAmount,credit:0,createdAt:p.createdAt});
  });
  db.payments.filter(p=>p.supplierId===sid).forEach(p=>{
    rows.push({date:p.date,desc:`سداد${p.paymentMethod?' — '+p.paymentMethod:''}${p.notes?' — '+p.notes:''}`,debit:0,credit:p.amount,createdAt:p.createdAt});
  });
  rows.sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  let bal=0;rows.forEach(r=>{bal+=r.debit-r.credit;r.balance=bal;});
  return rows;
}
function supplierName(sid){const s=db.suppliers.find(x=>x.id===sid);return s?s.name:'—';}

/* ALERTS */
function getAlerts(){
  const overdue=[];const soon=[];const recentPaid=[];
  const now=today();
  const sevenDaysLater=new Date();sevenDaysLater.setDate(sevenDaysLater.getDate()+7);
  const sevenStr=sevenDaysLater.toISOString().slice(0,10);

  db.purchases.forEach(p=>{
    const st=purchaseStatus(p);
    if(st.remaining<=0.01)return;
    if(p.dueDate && p.dueDate < now){
      overdue.push({p,st,days:Math.abs(daysUntil(p.dueDate))});
    } else if(p.dueDate && p.dueDate <= sevenStr){
      soon.push({p,st,days:daysUntil(p.dueDate)});
    }
  });

  // آخر سداد
  const recent=db.payments.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,3);

  return{overdue,soon,recentPaid:recent};
}

function renderMiniChart(){
  const days=[];const lb=['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'];
  const now=new Date();let mx=0;
  for(let i=6;i>=0;i--){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const k=d.toISOString().slice(0,10);
    const tt=db.purchases.filter(p=>p.date===k).reduce((s,p)=>s+p.totalAmount,0);
    days.push({k,day:lb[d.getDay()],total:tt,isToday:i===0});
    if(tt>mx)mx=tt;
  }
  if(mx===0)return '';
  const total=days.reduce((s,d)=>s+d.total,0);
  return `<div class="chart">
    <div class="ch-head">
      <div><div class="ch-title">${ic('trendUp','ic-sm')} آخر 7 أيام</div><div class="ch-sub">إجمالي المشتريات</div></div>
      <div class="ch-total">${fmt(total)} <span style="font-size:10px;color:var(--mut);font-weight:700">${cur()}</span></div>
    </div>
    <div class="ch-bars">${days.map(d=>{const h=mx>0?(d.total/mx)*100:0;return `<div class="ch-bar ${d.isToday?'today':''}" style="height:${Math.max(h,4)}%"></div>`;}).join('')}</div>
    <div class="ch-lbls">${days.map(d=>`<div>${d.day}</div>`).join('')}</div>
  </div>`;
}

/* Generic share */
function shareText(text){
  if(navigator.share){
    navigator.share({text}).catch(()=>{copyText(text);});
  } else {
    copyText(text);
  }
}
function copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>toast('تم النسخ ✓','success')).catch(()=>{fallbackCopy(text);});
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('تم النسخ ✓','success');}
  catch(e){toast('تعذّر النسخ','error');}
  document.body.removeChild(ta);
}

      <button class="chip co ${debtFilter==='partial'?'on':''}" onclick="setDebtFilter('partial')">${ic('clock')} جزئي</button>
      <button class="chip cg ${debtFilter==='paid'?'on':''}" onclick="setDebtFilter('paid')">${ic('checkC')} مسدد</button>
      <button class="chip cr ${debtFilter==='overdue'?'on':''}" onclick="setDebtFilter('overdue')">${ic('bell')} متأخر</button>
    </div>
    <div id="debtsList"></div>
  `;
  renderDebtsFiltered('');

function setDebtFilter(f){debtFilter=f;renderDebts();}
function renderDebtsFiltered(q){
  const todayStr=today();
  const list=[...db.purchases].filter(p=>{
    const st=purchaseStatus(p);
    if(debtFilter==='overdue'){ if(!(p.dueDate && p.dueDate<todayStr && st.remaining>0.01)) return false; }
    else if(debtFilter!=='all' && st.key!==debtFilter)return false;
    if(!q)return true;
    const s=(p.invoiceNumber||'')+' '+(p.description||'')+' '+supplierName(p.supplierId);
    return s.toLowerCase().includes(q.toLowerCase());
  }).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  const box=document.getElementById('debtsList');
  if(!box)return;
  if(!list.length){box.innerHTML=`<div class="empty"><div class="eico">${ic('receipt')}</div><p>لا توجد فواتير</p><small>جرّب فلتر آخر أو أضف فاتورة</small></div>`;return;}
  box.innerHTML=list.map(p=>{
    const st=purchaseStatus(p);
    const ratio=p.totalAmount>0?Math.min(100,(st.paid/p.totalAmount)*100):0;
    const ov=p.dueDate&&p.dueDate<todayStr&&st.remaining>0.01;
    const cls=st.key==='paid'?'paid-off':(st.key==='partial'?'partial-debt':'debt');

function quickRange(r){
  const d=new Date();
  if(r==='today'){reportFrom=reportTo=d.toISOString().slice(0,10);}
  else if(r==='week'){const w=new Date(d);w.setDate(d.getDate()-6);reportFrom=w.toISOString().slice(0,10);reportTo=d.toISOString().slice(0,10);}
  else if(r==='month'){reportFrom=d.toISOString().slice(0,8)+'01';reportTo=d.toISOString().slice(0,10);}
  else if(r==='prev'){const p=new Date(d.getFullYear(),d.getMonth(),0);reportFrom=p.toISOString().slice(0,8)+'01';reportTo=p.toISOString().slice(0,10);}
  else{reportFrom=reportTo='';}
  renderReports();
}
function renderMonthChart(){
  const months=[];const now=new Date();
  const mn=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  let mx=0;
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const k=d.toISOString().slice(0,7);
    const pur=db.purchases.filter(p=>p.date.startsWith(k)).reduce((s,p)=>s+p.totalAmount,0);
    const pay=db.payments.filter(p=>p.date.startsWith(k)).reduce((s,p)=>s+p.amount,0);
    months.push({k,name:mn[d.getMonth()],pur,pay});
    mx=Math.max(mx,pur,pay);
  }
  if(mx===0)return '';
  return `<div class="chart">
    <div class="ch-head"><div><div class="ch-title">${ic('chart','ic-sm')} آخر 6 أشهر</div><div class="ch-sub">المشتريات مقابل السداد</div></div></div>
    <div class="ch-bars">${months.map(m=>{
      const hp=mx>0?(m.pur/mx)*100:0;const hpay=mx>0?(m.pay/mx)*100:0;
      return `<div style="flex:1;display:flex;gap:2px;align-items:flex-end;height:100%">
        <div class="ch-bar" style="flex:1;height:${Math.max(hp,4)}%;background:linear-gradient(180deg,#fb7185,#f43f5e,#be123c)"></div>
        <div class="ch-bar" style="flex:1;height:${Math.max(hpay,4)}%;background:linear-gradient(180deg,#34d399,#10b981,#047857)"></div>
      </div>`;
    }).join('')}</div>
    <div class="ch-lbls">${months.map(m=>`<div>${m.name}</div>`).join('')}</div>
    <div class="ch-leg">
      <div class="lg"><span class="lgd" style="background:#dc2626"></span> مشتريات</div>
      <div class="lg"><span class="lgd" style="background:#10b981"></span> سداد</div>
    </div>
  </div>`;
}
function exportCSV(){
  const rows=[['التاريخ','النوع','المورد','البيان','مدين','دائن']];
  const all=[];
  db.purchases.forEach(p=>all.push({date:p.date,type:'شراء',sup:supplierName(p.supplierId),desc:p.description||'',debit:p.totalAmount,credit:0,at:p.createdAt}));
  db.payments.forEach(p=>all.push({date:p.date,type:'سداد',sup:supplierName(p.supplierId),desc:p.notes||'',debit:0,credit:p.amount,at:p.createdAt}));
  all.sort((a,b)=>a.date.localeCompare(b.date));
  all.forEach(r=>rows.push([r.date,r.type,r.sup,r.desc,r.debit,r.credit]));
  const csv='\uFEFF'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`sali-report-${today()}.csv`;a.click();
  toast('تم التصدير','success');
}

function savePurchase(pid){
  const sid=document.getElementById('fPurSup').value;
  const total=+document.getElementById('fPurTotal').value||0;
  const paid=+document.getElementById('fPurPaid').value||0;
  if(total<=0){toast('أدخل الإجمالي','error');return;}
  if(paid>total){toast('المدفوع أكبر من الإجمالي','error');return;}
  if(!sid){toast('اختر المورد','error');return;}
  const data={
    supplierId:sid,
    invoiceNumber:document.getElementById('fPurInv').value.trim(),
    date:document.getElementById('fPurDate').value||today(),
    description:document.getElementById('fPurDesc').value.trim(),
    totalAmount:total,
    paidAmount:paid,
    dueDate:document.getElementById('fPurDue').value||'',
    notes:document.getElementById('fPurNotes').value.trim()
  };
  if(pid){
    const old=db.purchases.find(x=>x.id===pid);
    db.payments=db.payments.filter(pay=>!(pay.purchaseId===pid&&pay.isInitial));
    Object.assign(old,data);
    if(paid>0)db.payments.push({id:uid(),supplierId:sid,purchaseId:pid,amount:paid,date:data.date,paymentMethod:'',notes:'دفعة أولى',isInitial:true,createdAt:Date.now()});
    addLog('تعديل شراء',`فاتورة ${data.invoiceNumber||''} — ${supplierName(sid)}`,total,sid);
  }else{
    const npid=uid();
    db.purchases.push({id:npid,...data,createdAt:Date.now()});
    if(paid>0)db.payments.push({id:uid(),supplierId:sid,purchaseId:npid,amount:paid,date:data.date,paymentMethod:'',notes:'دفعة أولى',isInitial:true,createdAt:Date.now()});
    addLog('إضافة شراء',`فاتورة ${data.invoiceNumber||''} — ${supplierName(sid)}`,total,sid);
  }
  saveDB();closeModal();toast('تم الحفظ','success');renderCurrent();
}

/* DUPLICATE PURCHASE */
function duplicatePurchase(pid){
  const p=db.purchases.find(x=>x.id===pid);
  if(!p)return;
  openPurchaseForm();
  setTimeout(()=>{
    document.getElementById('fPurSup').value=p.supplierId;
    document.getElementById('fPurDesc').value=p.description||'';
    document.getElementById('fPurTotal').value=p.totalAmount;
    document.getElementById('fPurPaid').value=0;
    document.getElementById('fPurInv').value='';
    document.getElementById('fPurDate').value=today();
    document.getElementById('fPurDue').value='';
    document.getElementById('fPurNotes').value=p.notes?'نسخة من فاتورة سابقة':'';
    calcRemain();
    toast('تم نسخ بيانات الفاتورة');
  },250);
}

/* PURCHASE DETAILS */
function openPurchaseDetails(pid){
  const p=db.purchases.find(x=>x.id===pid);
  if(!p)return;
  const st=purchaseStatus(p);
  const ov=p.dueDate&&p.dueDate<today()&&st.remaining>0.01;
  const dl=ov?daysBet(p.dueDate,today()):0;
  openModal(`
    ${mhead('تفاصيل الفاتورة','receipt')}
    <div class="card" style="background:var(--bg2);border:none">
      <div class="fl" style="justify-content:space-between;margin-bottom:8px"><span class="tm">المورد</span><span class="bd">${esc(supplierName(p.supplierId))}</span></div>
      <div class="fl" style="justify-content:space-between;margin-bottom:8px"><span class="tm">التاريخ</span><span>${p.date}</span></div>
      ${p.invoiceNumber?`<div class="fl" style="justify-content:space-between;margin-bottom:8px"><span class="tm">الفاتورة</span><span>${esc(p.invoiceNumber)}</span></div>`:''}
      ${p.description?`<div class="fl" style="justify-content:space-between;margin-bottom:8px;gap:10px"><span class="tm">الوصف</span><span style="text-align:left">${esc(p.description)}</span></div>`:''}
      ${p.dueDate?`<div class="fl" style="justify-content:space-between;margin-bottom:8px"><span class="tm">موعد السداد</span><span style="${ov?'color:var(--red);font-weight:800':''}">${p.dueDate}${ov?` <span style="background:var(--red-bg);color:#be123c;padding:2px 7px;border-radius:9px;font-size:9.5px;font-weight:800">متأخر ${dl}ي</span>`:''}</span></div>`:''}
      ${p.notes?`<div class="fl" style="justify-content:space-between;margin-bottom:8px;gap:10px"><span class="tm">ملاحظات</span><span style="text-align:left;font-size:12px">${esc(p.notes)}</span></div>`:''}
      <div style="border-top:1px dashed var(--bd2);margin:10px 0"></div>
      <div class="fl" style="justify-content:space-between;margin-bottom:6px"><span class="tm">الإجمالي</span><span class="bd num">${fmt(p.totalAmount)} ${cur()}</span></div>
      <div class="fl" style="justify-content:space-between;margin-bottom:6px"><span class="tm">المسدد</span><span class="bd t-green num">${fmt(st.paid)}</span></div>
      <div class="fl" style="justify-content:space-between"><span class="tm">المتبقي</span><span class="bd num ${st.remaining>0?'t-red':'t-green'}">${fmt(st.remaining)}</span></div>
      <div class="fl" style="justify-content:center;margin-top:11px"><div class="status ${st.key}">${ic(st.icon)} ${st.label}</div></div>
    </div>
    <div class="fl mt12" style="gap:7px;flex-wrap:wrap">
      ${st.remaining>0.01?`<button class="btn btn-green fl1" onclick="closeModal();openPaymentForm(null,'${p.supplierId}','${p.id}')">${ic('coins')} سداد</button>`:''}
      <button class="btn btn-ghost fl1" onclick="closeModal();duplicatePurchase('${p.id}')">${ic('copy')} نسخ</button>
      <button class="btn btn-ghost fl1" onclick="closeModal();openPurchaseForm('${p.id}')">${ic('edit')} تعديل</button>
      <button class="btn btn-danger" style="width:auto;padding:12px 15px" onclick="deletePurchase('${p.id}')">${ic('trash')}</button>
    </div>
  `);
}
function deletePurchase(pid){
  if(!confirm('حذف هذه الفاتورة وكل دفعاتها؟'))return;
  const p=db.purchases.find(x=>x.id===pid);
  db.purchases=db.purchases.filter(x=>x.id!==pid);
  db.payments=db.payments.filter(pay=>pay.purchaseId!==pid||!pay.isInitial);
  addLog('حذف شراء',`حذف فاتورة ${p?.invoiceNumber||''}`,p?.totalAmount||0,p?.supplierId);
  saveDB();closeModal();toast('تم الحذف','success');renderCurrent();
}

/* PAYMENT FORM */
function openPaymentForm(pid,presetSid,purchaseId){
  if(db.suppliers.length===0){toast('أضف موردًا أولاً');openSupplierForm();return;}
  const sid=presetSid||db.suppliers[0].id;
  const purs=db.purchases.filter(p=>p.supplierId===sid);
  const balance=supplierTotals(sid).balance;
  // Suggested amounts
  const suggestions = balance > 0 ? [
    {label:'نصف المبلغ',val:Math.round(balance/2)},
    {label:'الكل',val:Math.round(balance),isFull:true}
  ] : [];

  openModal(`
    ${mhead('تسجيل سداد','coins')}
    <div class="field"><label>${ic('store')} المورد <span class="req">*</span></label>
      <select id="fPaySup" onchange="onPaySupChange()">
        ${db.suppliers.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)} — ${fmt(supplierTotals(s.id).balance)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>${ic('file')} الفاتورة (اختياري)</label>
      <select id="fPayPur">
        <option value="">— بدون ربط —</option>
        ${purs.map(p=>{const st=purchaseStatus(p);return `<option value="${p.id}" ${purchaseId===p.id?'selected':''}>فاتورة ${esc(p.invoiceNumber||p.date)} — متبقي ${fmt(st.remaining)}</option>`;}).join('')}
      </select>
    </div>
    <div class="field am"><label>${ic('dollar')} المبلغ المدفوع <span class="req">*</span></label>
      <input type="number" inputmode="decimal" id="fPayAmt" placeholder="0">
      ${suggestions.length?`<div class="amt-actions">
        ${suggestions.map(s=>`<button class="amt-chip ${s.isFull?'full':''}" onclick="setPayAmount(${s.val})">${s.label} · ${fmt(s.val)}</button>`).join('')}
      </div>`:''}
    </div>
    <div class="row2">
      <div class="field"><label>${ic('cal')} التاريخ</label><input type="date" id="fPayDate" value="${today()}"></div>
      <div class="field"><label>${ic('wallet')} طريقة الدفع</label>
        <select id="fPayMethod">
          <option value="نقدًا">💵 نقدًا</option>
          <option value="تحويل">🏦 تحويل</option>
          <option value="شيك">📄 شيك</option>
          <option value="أخرى">أخرى</option>
        </select>
      </div>
    </div>
    <div class="field"><label>${ic('note')} ملاحظات</label><textarea id="fPayNotes" placeholder="اختياري"></textarea></div>
    <button class="btn btn-green" onclick="savePayment()">${ic('checkC')} تسجيل السداد</button>
  `);
  setTimeout(()=>document.getElementById('fPayAmt')?.focus(),200);
}
function setPayAmount(v){
  const i=document.getElementById('fPayAmt');
  if(i){i.value=v;i.focus();}
}
function onPaySupChange(){
  const sid=document.getElementById('fPaySup').value;
  const purs=db.purchases.filter(p=>p.supplierId===sid);
  document.getElementById('fPayPur').innerHTML='<option value="">— بدون ربط —</option>'+purs.map(p=>{
    const st=purchaseStatus(p);
    return `<option value="${p.id}">فاتورة ${esc(p.invoiceNumber||p.date)} — متبقي ${fmt(st.remaining)}</option>`;
  }).join('');
}
function savePayment(){
  const sid=document.getElementById('fPaySup').value;
  const amount=+document.getElementById('fPayAmt').value||0;
  const date=document.getElementById('fPayDate').value||today();
  const method=document.getElementById('fPayMethod').value;
  const notes=document.getElementById('fPayNotes').value.trim();
  const purchaseId=document.getElementById('fPayPur').value||null;
  if(amount<=0){toast('أدخل مبلغًا صحيحًا','error');return;}
  db.payments.push({id:uid(),supplierId:sid,purchaseId,amount,date,paymentMethod:method,notes,createdAt:Date.now()});
  addLog('سداد',`سداد ${method} — ${supplierName(sid)}`,amount,sid);
  saveDB();
  const t=supplierTotals(sid);const isPaidOff=t.balance<=0.01;
  setTimeout(()=>{
    openModal(`
      ${mhead('تم السداد','checkC')}
      <div id="receiptArea">
        <div class="receipt">
          <div class="rlogo"><svg viewBox="0 0 24 24">${ICONS.store}</svg></div>
          <div class="rstore">${esc(db.settings.storeName)}</div>
          <div class="rtag">سند سداد</div>
          <div class="rdiv"></div>
          <div class="rrow"><span class="k">المورد</span><span class="v">${esc(supplierName(sid))}</span></div>
          <div class="rrow"><span class="k">المبلغ المدفوع</span><span class="v t-green">${fmt(amount)} ${cur()}</span></div>
          <div class="rrow"><span class="k">طريقة الدفع</span><span class="v">${esc(method)}</span></div>
          <div class="rrow"><span class="k">التاريخ</span><span class="v">${date}</span></div>
          <div class="rdiv"></div>
          <div class="rrow"><span class="k">المتبقي</span><span class="v ${isPaidOff?'t-green':'t-red'}">${fmt(Math.max(0,t.balance))} ${cur()}</span></div>
          <div class="rfoot">${isPaidOff?'🎉 تم سداد الحساب بالكامل':'شكرًا لتعاملكم معنا 🌟'}</div>
        </div>
      </div>
      <div class="fl mt12" style="gap:6px;flex-wrap:wrap">
        <button class="btn btn-whatsapp fl1" onclick="shareReceipt('${sid}',${amount},'${date}','${esc(method)}',${t.balance})">${ic('whatsapp')} واتساب</button>
        <button class="btn btn-primary fl1" onclick="printReceipt()">${ic('printer')} طباعة</button>
        <button class="btn btn-ghost" style="width:auto;padding:12px 15px" onclick="closeModal()">${ic('x')}</button>
      </div>
    `);
    if(isPaidOff)confetti();
    renderCurrent();
  },120);
}
function printReceipt(){
  const a=document.getElementById('receiptArea');
  if(!a)return;
  document.getElementById('printArea').innerHTML=a.innerHTML;
  window.print();
}

/* SUPPLIER PRINT */

  const s=db.suppliers.find(x=>x.id===currentSupplierId);
  if(!s)return;
  const ledger=supplierLedger(s.id);

      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:#f3f4f6">
          <th style="border:1px solid #999;padding:6px">التاريخ</th>
          <th style="border:1px solid #999;padding:6px">البيان</th>
          <th style="border:1px solid #999;padding:6px">عليه</th>
          <th style="border:1px solid #999;padding:6px">له</th>
          <th style="border:1px solid #999;padding:6px">الرصيد</th>
        </tr></thead>

          <td style="border:1px solid #999;padding:6px;text-align:center">${r.date}</td>
          <td style="border:1px solid #999;padding:6px">${esc(r.desc)}</td>
          <td style="border:1px solid #999;padding:6px;text-align:center;color:#dc2626">${r.debit?fmt(r.debit):'—'}</td>
          <td style="border:1px solid #999;padding:6px;text-align:center;color:#16a34a">${r.credit?fmt(r.credit):'—'}</td>

      <h3 style="text-align:left;margin-top:16px">الرصيد المستحق: ${fmt(t.balance)} ${cur()}</h3>

/* LOG */
function openLog(){
  openModal(`
    ${mhead('سجل العمليات','hist')}
    ${db.log.length===0
      ?`<div class="empty"><div class="eico">${ic('hist')}</div><p>لا توجد عمليات</p></div>`
      :`<div style="max-height:60vh;overflow-y:auto">${db.log.slice(0,150).map(l=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--bd)">
          <div class="fl" style="justify-content:space-between">
            <span class="bd" style="font-size:12.5px">${esc(l.type)}</span>
            <span class="ts tm">${l.date} · ${l.time}</span>
          </div>
          <div class="ts tm" style="margin-top:3px">${esc(l.details)}${l.amount?` — <span class="bd num">${fmt(l.amount)} ${cur()}</span>`:''}</div>
        </div>
      `).join('')}</div>`}
  `);
}

/* BACKUP */
function exportBackup(){
  const data=JSON.stringify(db);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`sali-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('تم إنشاء النسخة','success');
}
function importBackup(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.suppliers||!data.purchases||!data.payments)throw new Error('bad');
      if(!confirm('سيتم استبدال كل البيانات. متابعة؟'))return;
      db=data;
      if(!db.settings)db.settings={storeName:'بقالة سالي',currency:'ريال',theme:'light',fontSize:'normal',pin:''};
      saveDB();applySettings();toast('تمت الاستعادة','success');go('home');
    }catch(err){toast('ملف غير صالح','error');}
  };
  r.readAsText(file);
}
function deleteAllData(){
  if(!confirm('⚠️ حذف جميع البيانات نهائيًا؟'))return;
  if(!confirm('تأكيد أخير؟'))return;
  const s=db.settings;
  db={suppliers:[],purchases:[],payments:[],log:[],settings:{storeName:s.storeName,ownerName:s.ownerName,phone:s.phone,currency:s.currency,pin:s.pin,theme:s.theme,fontSize:s.fontSize}};
  saveDB();toast('تم الحذف','success');go('home');
}

/* PIN */
let pinBuffer='';let pinSetupMode=null;let pinFirst='';
function openPinSetup(){
  pinBuffer='';pinSetupMode='new';pinFirst='';
  showPinPad('أدخل رمز PIN الجديد');
}
function removePin(){
  if(!confirm('إزالة رمز PIN؟'))return;
  db.settings.pin='';saveDB();toast('تم إزالة الرمز','success');renderSettings();
}
function showPinPad(title){
  document.getElementById('lock').classList.remove('hidden');
  document.getElementById('lockTitle').textContent=db.settings.storeName||'بقالة سالي';
  document.getElementById('lockSub').textContent=title||'أدخل رمز الدخول';
  renderPinDots();
  const keys=['1','2','3','4','5','6','7','8','9','','0','back'];
  document.getElementById('pinPad').innerHTML=keys.map(k=>{
    if(k==='')return `<button class="pin-key empty"></button>`;
    if(k==='back')return `<button class="pin-key back" onclick="pinPress('back')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>`;
    return `<button class="pin-key" onclick="pinPress('${k}')">${k}</button>`;
  }).join('');
}
function renderPinDots(){
  document.getElementById('pinDots').innerHTML=[0,1,2,3].map(i=>`<div class="pin-dot ${i<pinBuffer.length?'filled':''}"></div>`).join('');
}
function pinPress(k){
  if(k==='back'){pinBuffer=pinBuffer.slice(0,-1);renderPinDots();return;}
  if(pinBuffer.length>=4)return;
  pinBuffer+=k;renderPinDots();
  if(navigator.vibrate)navigator.vibrate(8);
  if(pinBuffer.length===4)setTimeout(handlePinComplete,120);
}
function handlePinComplete(){
  const e=pinBuffer;pinBuffer='';renderPinDots();
  if(pinSetupMode==='new'){pinFirst=e;pinSetupMode='confirm';document.getElementById('lockSub').textContent='تأكيد الرمز';return;}
  if(pinSetupMode==='confirm'){
    if(e!==pinFirst){toast('الرموز غير متطابقة','error');pinSetupMode='new';pinFirst='';document.getElementById('lockSub').textContent='أدخل رمز PIN الجديد';return;}
    db.settings.pin=pinFirst;saveDB();
    pinSetupMode=null;pinFirst='';
    document.getElementById('lock').classList.add('hidden');
    toast('تم تفعيل الرمز','success');renderSettings();
    return;
  }
  if(e===db.settings.pin){
    document.getElementById('lock').classList.add('hidden');
    if(navigator.vibrate)navigator.vibrate([10,40,10]);
  }else{
    document.querySelector('.lock-box').classList.add('shake');
    setTimeout(()=>document.querySelector('.lock-box').classList.remove('shake'),380);
    if(navigator.vibrate)navigator.vibrate([25,25,25]);
    toast('رمز خاطئ','error');
  }
}

/* INIT */
(function init(){
  applySettings();
  if(db.settings.pin)showPinPad('أدخل رمز الدخول');
  renderHome();
})();
</script>
